<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101722"><title>義務役新兵問卷｜v3 題目管理</title>
<style>
:root{color-scheme:dark;--bg:#101722;--panel:#1c2a3b;--panel2:#152131;--line:#40536b;--text:#f3f6fb;--muted:#aab8c8;--blue:#2388d1;--red:#9b4654;--green:#247b61}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;font-size:16px;line-height:1.55}
header{padding:24px 18px 14px;max-width:980px;margin:auto}h1{font-size:25px;margin:0 0 5px}h2{font-size:20px;margin:0 0 14px}h3{font-size:17px;margin:18px 0 10px}
.muted{color:var(--muted);font-size:13px}main{max-width:980px;margin:auto;padding:0 14px 42px}.card{background:var(--panel);border:1px solid #26384d;border-radius:16px;padding:18px;margin:14px 0}
input,textarea{width:100%;padding:13px;margin:6px 0 12px;border-radius:10px;border:1px solid #52647a;background:#101722;color:var(--text);font:inherit;font-size:16px}textarea{min-height:100px;resize:vertical}label{display:block;font-weight:650;margin-top:8px}
button{min-height:43px;padding:10px 14px;border:1px solid transparent;border-radius:10px;margin:3px;background:#36516e;color:white;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #66b8ff;outline-offset:2px}.primary{background:var(--blue)}.danger{background:var(--red)}.success{background:var(--green)}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.question-list{display:grid;gap:9px;margin-top:14px}.question-row{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel2)}.question-row.active{border:2px solid #55a9e8;background:#20354a}
.question-top{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.question-top button{min-height:38px;padding:7px 11px}.question-preview{white-space:pre-wrap;overflow-wrap:anywhere}
.option-card{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:var(--panel2)}.option-grid{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px}.option-grid input{margin-bottom:5px}
.status{font-size:13px;color:#9bd9bc;min-height:22px}.pill{display:inline-block;border-radius:999px;padding:3px 9px;background:#30465e;color:#cfe4fa;font-size:12px}.help{color:var(--muted);font-size:13px;margin-top:-6px}
.preview{border:1px dashed #52647a;border-radius:12px;padding:12px;margin-top:12px}.preview-option{padding:9px 10px;border:1px solid var(--line);border-radius:9px;margin:7px 0}
@media(min-width:760px){.columns{display:grid;grid-template-columns:minmax(260px,.9fr) minmax(0,1.4fr);gap:14px;align-items:start}.sticky{position:sticky;top:12px}}
@media(max-width:420px){header{padding-top:18px}.card{padding:14px}.option-grid{grid-template-columns:minmax(0,1fr) 88px}.question-top button{font-size:14px}}
</style></head>
<body>
<header><h1>義務役新兵問卷｜題目管理</h1><div class="muted">v3.0 獨立測試環境｜目前儲存在此裝置，不會寫入 v2 正式資料</div></header>
<main>
<section class="card"><h2>問卷基本設定</h2><label for="surveyTitle">問卷標題</label><input id="surveyTitle" maxlength="80" placeholder="輸入問卷標題">
<div class="toolbar"><button class="success" onclick="saveAll()">儲存全部變更</button><span id="saveStatus" class="status" aria-live="polite">載入完成</span></div></section>
<div class="columns">
<section class="card sticky"><h2>題目清單 <span id="questionCount" class="pill">0 題</span></h2><button class="primary" onclick="addQuestion()">＋ 新增題目</button><div id="questions" class="question-list"></div><p class="help">使用 ↑ ↓ 調整題目順序；點選「編輯」修改內容。</p></section>
<section class="card"><h2>題目編輯</h2><div id="editor">請先選擇題目</div></section>
</div>
<section class="card"><h2>問卷預覽與匯出</h2><div class="toolbar"><button onclick="preview()">更新預覽</button><button class="primary" onclick="exportData()">下載設定 JSON</button></div><div id="previewArea" class="preview muted">按「更新預覽」檢查題目呈現。</div></section>
</main>
<script>
"use strict";
const KEY="recruit_v3_draft";
const DEFAULT_DATA={title:"義務役新兵生存適應力測驗",questions:[{id:"q1",text:"如果遇到不熟悉的營區規定，你會怎麼做？",options:[{id:"a",text:"先觀察別人",score:15},{id:"b",text:"詢問同梯",score:45},{id:"c",text:"詢問幹部",score:75},{id:"d",text:"先確認規定",score:90}]}]};
function loadData(){try{const saved=JSON.parse(localStorage.getItem(KEY)||"null");if(saved&&Array.isArray(saved.questions))return saved;}catch(e){}return JSON.parse(JSON.stringify(DEFAULT_DATA));}
let data=loadData(),selected=0;
const $=id=>document.getElementById(id);
function escapeHTML(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function status(message){$("saveStatus").textContent=message;}
function persist(message="已儲存至此裝置"){try{localStorage.setItem(KEY,JSON.stringify(data));status(message);return true;}catch(e){status("儲存失敗：請檢查裝置儲存空間");return false;}}
function collectEditor(){
 const q=data.questions[selected];if(!q||!$("qtext"))return true;
 const text=$("qtext").value.trim();if(!text){alert("請先輸入題目內容。");$("qtext").focus();return false;}
 const options=[];
 for(let i=0;i<q.options.length;i++){
  const optionText=$("ot"+i).value.trim(),scoreText=$("os"+i).value;
  if(!optionText){alert("第 "+(i+1)+" 個選項尚未填寫。");$("ot"+i).focus();return false;}
  if(scoreText===""||!Number.isFinite(Number(scoreText))){alert("第 "+(i+1)+" 個選項的分數請填寫有效數字。");$("os"+i).focus();return false;}
  options.push({...q.options[i],text:optionText,score:Number(scoreText)});
 }
 q.text=text;q.options=options;return true;
}
function saveAll(){if(!collectEditor())return;data.title=$("surveyTitle").value.trim()||"義務役新兵生存適應力測驗";persist("全部變更已儲存");render();}
function render(){
 $("surveyTitle").value=data.title||"";$("questionCount").textContent=data.questions.length+" 題";
 $("questions").innerHTML=data.questions.map((q,i)=>'<article class="question-row '+(i===selected?"active":"")+'"><div class="question-top"><span class="pill">第 '+(i+1)+' 題</span><button onclick="selectQuestion('+i+')">編輯</button><button aria-label="第 '+(i+1)+' 題上移" onclick="moveQuestion('+i+',-1)" '+(i===0?"disabled":"")+' >↑</button><button aria-label="第 '+(i+1)+' 題下移" onclick="moveQuestion('+i+',1)" '+(i===data.questions.length-1?"disabled":"")+' >↓</button><button class="danger" onclick="deleteQuestion('+i+')">刪除</button></div><div class="question-preview">'+escapeHTML(q.text||"（尚未填寫題目）")+'</div><div class="muted">'+q.options.length+' 個選項</div></article>').join("");
 renderEditor();
}
function renderEditor(){
 const q=data.questions[selected];if(!q){$("editor").innerHTML='<p class="muted">目前沒有題目，請新增題目。</p>';return;}
 let html='<div class="muted">題目 ID：'+escapeHTML(q.id)+'</div><label for="qtext">問題內容</label><textarea id="qtext" maxlength="300" placeholder="請輸入完整題目">'+escapeHTML(q.text)+'</textarea><h3>答案選項 <span class="pill">'+q.options.length+'/10</span></h3><p class="help">每題至少 2 個、最多 10 個選項。分數可依測驗規則設定。</p>';
 q.options.forEach((o,i)=>{html+='<div class="option-card"><div class="toolbar"><strong>選項 '+(i+1)+'</strong><span class="pill">ID：'+escapeHTML(o.id)+'</span></div><label for="ot'+i+'">選項文字</label><input id="ot'+i+'" maxlength="200" value="'+escapeHTML(o.text)+'" placeholder="輸入選項內容"><div class="option-grid"><div><label for="os'+i+'">分數</label><input id="os'+i+'" type="number" step="any" value="'+escapeHTML(o.score)+'"></div><div><label>調整順序</label><div class="toolbar"><button onclick="moveOption('+i+',-1)" '+(i===0?"disabled":"")+'>↑</button><button onclick="moveOption('+i+',1)" '+(i===q.options.length-1?"disabled":"")+'>↓</button></div></div></div><button class="danger" onclick="deleteOption('+i+')" '+(q.options.length<=2?"disabled":"")+'>刪除此選項</button></div>';});
 html+='<div class="toolbar"><button class="primary" onclick="addOption()" '+(q.options.length>=10?"disabled":"")+'>＋ 增加選項</button><button class="success" onclick="saveAll()">儲存本題</button></div>';$("editor").innerHTML=html;
}
function selectQuestion(i){if(!collectEditor())return;selected=i;persist();render();}
function addQuestion(){if(!collectEditor())return;const id="q"+Date.now();data.questions.push({id,text:"",options:[{id:id+"_a",text:"選項 1",score:0},{id:id+"_b",text:"選項 2",score:0}]});selected=data.questions.length-1;persist("已新增題目草稿");render();$("qtext").focus();}
function deleteQuestion(i){if(!confirm("確定刪除第 "+(i+1)+" 題？此操作會儲存到本機草稿。"))return;if(i!==selected&&!collectEditor())return;data.questions.splice(i,1);selected=Math.max(0,Math.min(selected,data.questions.length-1));persist("題目已刪除");render();}
function moveQuestion(i,delta){if(!collectEditor())return;const target=i+delta;if(target<0||target>=data.questions.length)return;[data.questions[i],data.questions[target]]=[data.questions[target],data.questions[i]];selected=target;persist("題目順序已更新");render();}
function addOption(){if(!collectEditor())return;const q=data.questions[selected];if(!q||q.options.length>=10)return;q.options.push({id:q.id+"_o"+Date.now(),text:"新選項",score:0});persist("已新增選項");renderEditor();}
function deleteOption(i){const q=data.questions[selected];if(!q||q.options.length<=2)return;if(!collectEditor())return;q.options.splice(i,1);persist("選項已刪除");renderEditor();}
function moveOption(i,delta){if(!collectEditor())return;const q=data.questions[selected],target=i+delta;if(!q||target<0||target>=q.options.length)return;[q.options[i],q.options[target]]=[q.options[target],q.options[i]];persist("選項順序已更新");renderEditor();}
function preview(){if(!collectEditor())return;data.title=$("surveyTitle").value.trim()||"義務役新兵生存適應力測驗";persist("預覽內容已更新");let html="<h3>"+escapeHTML(data.title)+"</h3>";data.questions.forEach((q,i)=>{html+='<div class="option-card"><strong>'+(i+1)+". "+escapeHTML(q.text)+'</strong>';q.options.forEach(o=>{html+='<div class="preview-option">'+escapeHTML(o.text)+' <span class="muted">('+escapeHTML(o.score)+' 分)</span></div>';});html+="</div>";});$("previewArea").classList.remove("muted");$("previewArea").innerHTML=html||"目前沒有題目。";}
function exportData(){if(!collectEditor())return;data.title=$("surveyTitle").value.trim()||"義務役新兵生存適應力測驗";persist("匯出前已儲存");const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json;charset=utf-8"});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="v3-questions.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
render();
</script></body></html>
