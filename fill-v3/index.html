<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>義務役新兵問卷｜V3 填寫</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#f5f5f5;font:16px/1.7 system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:760px;margin:24px auto;padding:18px}.panel{background:#070707;border:1px solid #292929;border-radius:26px;padding:26px}.eyebrow{color:#999;font-size:13px;letter-spacing:.08em}.rule{height:1px;background:#292929;margin:18px 0 24px}h1{font-size:27px;line-height:1.4;margin:8px 0 10px}h2{font-size:19px;margin:0 0 14px}.muted{color:#aaa;font-size:14px}.field{margin:18px 0}.field label,.qtitle{display:block;font-weight:650;margin-bottom:8px}.field input,.field select,.field textarea,.answer-text{width:100%;background:#111;color:#fff;border:1px solid #444;border-radius:11px;padding:12px;font:inherit}.q{border-top:1px solid #292929;padding:20px 0}.opt{display:block;padding:11px 13px;border:1px solid #333;border-radius:11px;margin:8px 0;font-weight:400}.opt input{margin-right:9px;accent-color:#4b91d0}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.scale label{border:1px solid #333;border-radius:10px;padding:12px 4px;text-align:center}.scale input{display:block;margin:8px auto 0;accent-color:#4b91d0}.btn{width:100%;border:1px solid #245f9e;border-radius:12px;background:#245f9e;color:white;padding:13px;font:inherit;font-weight:700}.status{margin-top:14px;color:#9bc5ec}.consent{display:flex;gap:10px;align-items:flex-start;margin:22px 0}.consent input{margin-top:7px}.error{color:#e58a91}.hidden{display:none}@media(max-width:600px){.wrap{padding:10px;margin:12px auto}.panel{padding:20px 16px;border-radius:22px}h1{font-size:23px}}
</style></head><body><main class="wrap"><section class="panel"><div class="eyebrow">V3 QUESTIONNAIRE</div><h1 id="title">正在載入問卷…</h1><p class="muted">請依照實際情況填寫。所有標示題目均須完成。</p><div class="rule"></div><form id="survey" class="hidden"><section><h2>基本資料</h2>
<div class="field"><label for="name">姓名或識別稱呼</label><input id="name" maxlength="100" required></div>
<div class="field"><label for="family_structure">家庭結構</label><input id="family_structure" maxlength="100" placeholder="請填寫家庭結構" required></div>
<div class="field"><label for="family_income">家庭月收入</label><input id="family_income" maxlength="100" placeholder="請填寫收入區間" required></div>
<div class="field"><label for="personal_debt">個人負債</label><input id="personal_debt" maxlength="100" placeholder="請填寫無負債或負債區間" required></div>
<div class="field"><label for="education">最高學歷</label><input id="education" maxlength="100" required></div>
<div class="field"><label for="work_experience">正式工作經驗</label><input id="work_experience" maxlength="100" required></div>
</section><div id="questions"></div><label class="consent"><input id="consent" type="checkbox" required><span>我確認以上資料為本人填寫，並同意將作答內容儲存於本問卷資料庫，供問卷統計與研究分析使用。</span></label><button class="btn" id="submit" type="submit">送出問卷</button><div id="status" class="status" role="status"></div></form><div id="loading" class="muted">正在連線讀取最新問卷…</div></section></main>
<script>
const API="https://script.google.com/macros/s/AKfycbx4854pk5ehVyELMaxD4wIHRiQx8ShdUUc66K5_COyK1w0-7Ovf3oUNoSSJj-z28QSg/exec";
let published=null;
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function jsonp(action){return new Promise((resolve,reject)=>{const cb="v3_"+Date.now();const s=document.createElement("script");const t=setTimeout(()=>{delete window[cb];s.remove();reject(new Error("連線逾時"));},15000);window[cb]=d=>{clearTimeout(t);delete window[cb];s.remove();resolve(d);};s.onerror=()=>{clearTimeout(t);delete window[cb];s.remove();reject(new Error("無法讀取問卷"));};s.src=API+"?action="+action+"&callback="+cb;document.body.appendChild(s);});}
function render(){document.getElementById("title").textContent=published.title||"義務役新兵問卷";document.getElementById("questions").innerHTML=published.questions.map((q,i)=>{let h='<div class="q" data-q="'+esc(q.id)+'"><div class="qtitle">'+(i+1)+'. '+esc(q.text)+'</div>';if(q.type==="choice"){(q.options||[]).forEach(o=>h+='<label class="opt"><input type="radio" name="q_'+esc(q.id)+'" value="'+esc(o.id)+'" required>'+esc(o.text)+'</label>');}else if(q.type==="scale"){h+='<p class="muted">1｜'+esc(q.minLabel||"非常不同意")+'　—　5｜'+esc(q.maxLabel||"非常同意")+'</p><div class="scale">'+[1,2,3,4,5].map(n=>'<label>'+n+'<input type="radio" name="q_'+esc(q.id)+'" value="'+n+'" required></label>').join("")+'</div>';}else{h+='<textarea class="answer-text" name="q_'+esc(q.id)+'" rows="3" placeholder="'+esc(q.placeholder||"請輸入答案")+'" required></textarea>';}return h+'</div>';}).join("");document.getElementById("loading").classList.add("hidden");document.getElementById("survey").classList.remove("hidden");}
document.getElementById("survey").addEventListener("submit",async e=>{e.preventDefault();const form=e.currentTarget; if(!form.reportValidity())return;const answers={};published.questions.forEach(q=>{const el=form.querySelector('[name="q_'+CSS.escape(q.id)+'"]:checked')||form.querySelector('[name="q_'+CSS.escape(q.id)+'"]');answers[q.id]=el?el.value:"";});const payload={action:"submit",response:{name:document.getElementById("name").value,family_structure:document.getElementById("family_structure").value,family_income:document.getElementById("family_income").value,personal_debt:document.getElementById("personal_debt").value,education:document.getElementById("education").value,work_experience:document.getElementById("work_experience").value,answers,consent:document.getElementById("consent").checked}};const btn=document.getElementById("submit"),status=document.getElementById("status");btn.disabled=true;status.textContent="正在送出並確認雲端保存…";try{const before=await jsonp("getStats");await fetch(API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(payload)});let saved=false;for(let i=0;i<10;i++){await new Promise(r=>setTimeout(r,1000));const after=await jsonp("getStats");if(after.ok&&after.total>before.total){saved=true;break;}}if(!saved)throw new Error("尚未確認雲端收到資料，請勿重複送出；可稍後聯絡管理員確認。");form.innerHTML='<h2>問卷已成功送出，感謝你的填寫。</h2><p class="muted">作答資料已保存。</p>';}catch(err){status.textContent="送出狀態未能確認："+err.message;btn.disabled=false;}});
(async()=>{try{published=await jsonp("getPublished");if(!published.ok||!published.published||!published.questions.length)throw new Error("目前尚未發布問卷");render();}catch(e){document.getElementById("loading").textContent=e.message+"，請稍後再試。";}})();
</script></body></html>
